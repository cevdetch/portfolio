name: Refresh facts

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# contents to commit and move main, checks to post the gate check the run earned: main's rules require it.
permissions:
  contents: write
  checks: write

concurrency:
  group: refresh-facts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # About two and a half times the slowest green run, which spends most of its time in Lighthouse.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The privacy gate scans every commit message on the branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun --bun run fetch-facts --changes-file "$RUNNER_TEMP/changes.txt" --held-file "$RUNNER_TEMP/held.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
      - id: diff
        run: echo "changed=$([ -s "$RUNNER_TEMP/changes.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # The same gates as CI, on the refreshed tree; only the privacy gate sees the deny list.
      - if: steps.diff.outputs.changed == 'true'
        run: bun --bun run check && bun run test && bun run test:build && bun --bun run build && bun --bun run verify:output && bun --bun run lint:html
      - if: steps.diff.outputs.changed == 'true'
        run: bun --bun run verify:portfolio
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - if: steps.diff.outputs.changed == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist --no-progress 'dist/**/*.html'
          fail: true
      - if: steps.diff.outputs.changed == 'true'
        run: bun --bun run lighthouse
      - if: steps.diff.outputs.changed == 'true'
        run: bun scripts/commit-facts.ts "$RUNNER_TEMP/changes.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A site measured under 100 kept its last 100s on the page; the run fails so the site gets debugged and fixed.
      - name: Fail on a site measured under 100
        run: |
          [ -s "$RUNNER_TEMP/held.txt" ] || exit 0
          while IFS= read -r line; do echo "::error::$line"; done < "$RUNNER_TEMP/held.txt"
          exit 1
