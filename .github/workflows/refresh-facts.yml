name: Refresh facts

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-facts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The privacy gate scans every commit message on the branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm fetch-facts --changes-file "$RUNNER_TEMP/changes.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: diff
        run: echo "changed=$([ -s "$RUNNER_TEMP/changes.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # The same gates as CI, on the refreshed tree; only the privacy gate sees the deny list.
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm check && pnpm test && pnpm test:build && pnpm build && pnpm verify:output && pnpm lint:html
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm verify:portfolio
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - if: steps.diff.outputs.changed == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist --no-progress 'dist/**/*.html'
          fail: true
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm lighthouse
      - if: steps.diff.outputs.changed == 'true'
        run: node scripts/commit-facts.ts "$RUNNER_TEMP/changes.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
