# Internal links are checked against dist/ through --root-dir. Absolute cevdet.ch URLs
# (canonical, og:url) point at the not-yet-live production site; verify:output covers them.
exclude = [
  '^https://cevdet\.ch/',
  # LinkedIn answers bots with HTTP 999.
  '^https://www\.linkedin\.com/',
  # npm registry answers automated checkers with 403
  '^https://www\.npmjs\.com/',
  # MySQL site answers automated checkers with 403
  '^https://www\.mysql\.com/',
  # Paperless documentation answers automated checkers with 403
  '^https://docs\.paperless-ngx\.com/',
  # GNU site times out from CI runners even with retries and a 30s timeout
  '^https://www\.gnu\.org/',
]
max_retries = 3
timeout = 30
accept = ["200", "429"]
